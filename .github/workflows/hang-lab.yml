name: Hang Lab 5892

# Round 3: round 2 caught the hang (iteration 1, parallel test-threads).
# Hung main_bin: SINGLE thread parked on futex (not epoll), server LISTENing,
# zero established connections. Three hypotheses to discriminate:
#  (a) condvar-fallback cycling (wait-driver never registered)  -> timed futex, wakes every ~1s
#  (b) single-thread Mutex self-deadlock                        -> infinite futex, zero wakes
#  (c) concurrent-perry-compile corrupted binary                -> hash differs from clean recompile,
#                                                                  and serial test-threads never hang
on:
  push:
    branches: [debug/5892-hang-lab]
  workflow_dispatch:

concurrency:
  group: hang-lab
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: "12G"
  CARGO_INCREMENTAL: "0"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-perry-hang-lab-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-perry-

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: "false"

      - name: Install tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb strace
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Build the test (no run)
        run: cargo test -p perry --test issue_4903_listen_callback_deferred --no-run

      - name: Repro + discriminate
        run: |
          set +e
          probe_hung() {
            local mb=$1
            echo "==== /proc/$mb/syscall (futex arg 4 = timeout ptr; 0x0 => INFINITE) ===="
            cat /proc/$mb/syscall
            echo "==== 6s strace sample (wake pattern) ===="
            sudo timeout 6 strace -f -p $mb -e trace=futex,epoll_wait,epoll_pwait,poll,clock_nanosleep 2>&1 | head -40
            echo "==== /proc/$mb/stat utime/stime twice, 3s apart (CPU?) ===="
            awk '{print "utime="$14" stime="$15}' /proc/$mb/stat
            sleep 3
            awk '{print "utime="$14" stime="$15}' /proc/$mb/stat
            echo "==== corruption check: rehash + clean sequential recompile ===="
            local dir=$(dirname $(readlink -f /proc/$mb/exe))
            echo "hung binary: $(md5sum /proc/$mb/exe | cut -d' ' -f1)"
            cp /proc/$mb/exe /tmp/hung_main_bin
            if [ -f "$dir/main.ts" ]; then
              (cd "$dir" && "$GITHUB_WORKSPACE/target/debug/perry" compile main.ts -o main_bin_clean >/dev/null 2>&1 \
                 && echo "clean recompile: $(md5sum main_bin_clean | cut -d' ' -f1)")
            fi
            echo "==== gdb all-thread bt (for the record) ===="
            sudo gdb -p $mb -batch -ex 'set pagination off' -ex 'thread apply all bt' 2>&1 | sed -n '1,40p'
          }
          run_phase() {
            local label=$1; shift
            local extra="$1"
            for i in $(seq 1 6); do
              echo "=== [$label] iteration $i ==="
              cargo test -p perry --test issue_4903_listen_callback_deferred -- --nocapture $extra > /tmp/ct.out 2>&1 &
              cpid=$!
              deadline=$(( SECONDS + 240 ))
              hung=1
              while [ $SECONDS -lt $deadline ]; do
                if ! kill -0 $cpid 2>/dev/null; then hung=""; break; fi
                sleep 1
              done
              if [ -n "$hung" ]; then
                echo "!!! [$label] HANG on iteration $i"
                mb=$(pgrep -x main_bin | head -1)
                if [ -n "$mb" ]; then probe_hung $mb; else echo "(no main_bin process?)"; ps -ef | grep -E 'issue_4903|perry' | grep -v grep; fi
                pkill -9 -x main_bin
                # let the harness observe the kill and print stdout/stderr (the 5892-diag lines)
                sleep 5
                echo "-------- ct.out tail (diag lines) --------"
                tail -80 /tmp/ct.out
                grep -n '5892-diag' /tmp/ct.out || echo "(no 5892-diag lines in ct.out)"
                pkill -9 -f issue_4903; kill -9 $cpid 2>/dev/null
                return 1
              fi
              tail -3 /tmp/ct.out; grep -m4 "5892-diag" /tmp/ct.out || true
            done
            echo "[$label] no hang in 6 iterations"
            return 0
          }
          echo "############ PHASE 1: default (parallel) test threads ############"
          run_phase parallel ""
          p1=$?
          echo "############ PHASE 2: --test-threads=1 (serial: no concurrent perry compiles) ############"
          run_phase serial "--test-threads=1"
          p2=$?
          echo "RESULT: parallel_hang=$p1 serial_hang=$p2 (1=hang captured)"
          # exit 1 only if we captured evidence, so the log is easy to spot
          [ $p1 -eq 1 -o $p2 -eq 1 ] && exit 1
          exit 0
