name: Hang Lab 5892

# Round 7: the shim gate (merged, #5911) did NOT fix the real-recipe hang —
# the v0.5.1219 gate run still hit the 180-min cargo-test timeout. All prior
# lab rounds that built ext staticlibs were testing a DIFFERENT configuration:
# test.yml's cargo-test job never builds the ext .a files (and even
# `cargo clean -p`'s the ext crates), so the harness-compiled binaries resolve
# node:http differently. This round replicates test.yml's build recipe exactly
# and captures the linker map of the hanging binary.
on:
  push:
    branches: [debug/5892-hang-lab]
  workflow_dispatch:

concurrency:
  group: hang-lab
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: "12G"
  CARGO_INCREMENTAL: "0"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-perry-hang-lab-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-perry-

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: "false"

      - name: Install gdb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Build exactly what test.yml builds (wrappers, NO ext staticlibs)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static
          cargo test -p perry --test issue_4903_listen_callback_deferred --no-run
          echo "==== .a files present in target/debug ===="
          ls target/debug/*.a 2>/dev/null || echo "(none)"

      - name: Real-recipe repro with link map
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          PERRY_LINK_MAP: /tmp/map.txt
        run: |
          set +e
          export CARGO_BUILD_JOBS=1
          for i in $(seq 1 4); do
            echo "=== real-recipe iteration $i (serial threads) ==="
            rm -f /tmp/map.txt
            cargo test -p perry --test issue_4903_listen_callback_deferred -- --test-threads=1 --nocapture > /tmp/ct.out 2>&1 &
            cpid=$!
            deadline=$(( SECONDS + 300 )); hung=1
            while [ $SECONDS -lt $deadline ]; do kill -0 $cpid 2>/dev/null || { hung=""; break; }; sleep 1; done
            if [ -n "$hung" ]; then
              echo "!!! HANG on iteration $i — capturing evidence"
              mb=$(pgrep -x main_bin | head -1)
              if [ -n "$mb" ]; then
                echo "---- /proc/$mb/syscall ----"; cat /proc/$mb/syscall
                echo "---- gdb bt ----"
                sudo gdb -p $mb -batch -ex 'set pagination off' -ex 'thread apply all bt' 2>&1 | sed -n '1,60p'
              fi
              echo "---- who provided the perry_ffi bridge (map) ----"
              grep -B2 -A1 -E '^ \.text\.perry_ffi_spawn_(async|blocking_with_reactor)$' /tmp/map.txt | head -20
              echo "---- archives pulled into the link ----"
              grep -oE '[^ /]+\.a\([^)]+\)' /tmp/map.txt | cut -d'(' -f1 | sort | uniq -c | sort -rn | head -15
              echo "---- ext vs stdlib members providing perry_ffi/test shims ----"
              grep -E 'test_async_shims|perry_ffi_async' /tmp/map.txt | head -10
              echo "---- event_pump provider (which archive has js_wait_for_event) ----"
              grep -B2 -A1 -E '^ \.text\.js_wait_for_event$' /tmp/map.txt | head -8
              echo "---- ct.out tail ----"
              pkill -9 -x main_bin; sleep 4; tail -50 /tmp/ct.out; grep -m4 '5892-diag' /tmp/ct.out
              pkill -9 -f issue_4903; kill -9 $cpid 2>/dev/null
              exit 1
            fi
            tail -3 /tmp/ct.out; grep -m4 '5892-diag' /tmp/ct.out || true
          done
          echo "no hang in 4 real-recipe iterations (fix may hold in this env after all)"
