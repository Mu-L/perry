name: Hang Lab 5892

# Diagnostic lab for issue #5892. Round 2: the standalone concurrent repro was
# clean over 40 iterations, so this round runs the EXACT failing cargo test
# (debug-profile perry driver, Command::output() pipes, libtest harness) in a
# loop under a watchdog. On hang it gdb-dumps every process in the tree
# (harness, perry, main_bin) — the evidence the 180-min timeout never leaves.
# Delete this workflow with the branch once #5892 is fixed.

on:
  push:
    branches: [debug/5892-hang-lab]
  workflow_dispatch:

concurrency:
  group: hang-lab
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: "12G"
  CARGO_INCREMENTAL: "0"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache objects
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-perry-hang-lab-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-perry-

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: "false"

      - name: Install gdb + open ptrace
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Build the test (no run) so the loop below is pure runtime
        run: cargo test -p perry --test issue_4903_listen_callback_deferred --no-run

      - name: Exact cargo-test repro loop with gdb-on-hang
        run: |
          set +e
          dump_tree() {
            echo "######## HANG DUMP ########"
            ps -ef | grep -E 'issue_4903|main_bin|perry' | grep -v grep
            echo "-------- sockets --------"
            ss -tanp 2>/dev/null | head -40
            for pat in 'issue_4903' 'main_bin' '/perry compile'; do
              for p in $(pgrep -f "$pat"); do
                echo "======== $pat pid $p ========"
                head -8 /proc/$p/status 2>/dev/null
                echo "wchan: $(cat /proc/$p/wchan 2>/dev/null)"
                sudo gdb -p $p -batch -ex 'set pagination off' -ex 'thread apply all bt' 2>&1 | sed -n '1,250p'
              done
            done
            echo "######## END DUMP ########"
          }
          for i in $(seq 1 8); do
            echo "=== cargo-test iteration $i ==="
            cargo test -p perry --test issue_4903_listen_callback_deferred -- --nocapture > /tmp/ct.out 2>&1 &
            cpid=$!
            deadline=$(( SECONDS + 300 ))
            hung=1
            while [ $SECONDS -lt $deadline ]; do
              if ! kill -0 $cpid 2>/dev/null; then hung=""; break; fi
              sleep 1
            done
            if [ -n "$hung" ]; then
              echo "!!! HANG on iteration $i (cargo pid $cpid alive after 300s)"
              dump_tree
              pkill -9 -f issue_4903; pkill -9 -f main_bin; kill -9 $cpid 2>/dev/null
              tail -40 /tmp/ct.out
              exit 1
            fi
            tail -5 /tmp/ct.out
          done
          echo "no hang in 8 exact cargo-test iterations"
